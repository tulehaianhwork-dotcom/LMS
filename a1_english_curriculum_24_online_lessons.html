                return matchesType && matchesSearch;
            });

            if (filtered.length === 0) {
                lessonsListEl.innerHTML = `<div class="p-4 text-center text-xs text-slate-500">Không tìm thấy bài học phù hợp</div>`;
                return;

                const isCompleted = completedLessons.includes(lesson.id);

        filterAllBtn.onclick = () => setFilter("ALL", filterAllBtn);
        filterGrammarBtn.onclick = () => setFilter("GRAMMAR", filterGrammarBtn);
        filterTopicBtn.onclick = () => setFilter("TOPIC", filterTopicBtn);

        // Completion toggle listener
        toggleCompleteBtn.onclick = () => {
            if (completedLessons.includes(currentLessonId)) {
                completedLessons = completedLessons.filter(id => id !== currentLessonId);
            } else {
                completedLessons.push(currentLessonId);
            }
            localStorage.setItem("completedLessons_a1", JSON.stringify(completedLessons));
            updateProgressUI();
            renderLessonsList();
        };

        // Reset progress listener
        let resetClicks = 0;
        resetProgressBtn.onclick = () => {
            resetClicks++;
            if (resetClicks === 1) {
                resetProgressBtn.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Bấm lần nữa để xóa`;
                resetProgressBtn.classList.replace("text-slate-400", "text-rose-500");
                setTimeout(() => {
                    resetClicks = 0;
                    resetProgressBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Đặt lại`;
                    resetProgressBtn.classList.replace("text-rose-500", "text-slate-400");
                }, 3000);
            } else if (resetClicks === 2) {
                completedLessons = [];
                localStorage.removeItem("completedLessons_a1");
                updateProgressUI();
                renderLessonsList();
                resetClicks = 0;
                resetProgressBtn.innerHTML = `<i class="fa-solid fa-circle-check"></i> Đã xóa tiến độ`;
                setTimeout(() => {
                    resetProgressBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Đặt lại`;
                    resetProgressBtn.classList.replace("text-rose-500", "text-slate-400");
                }, 2000);
            }
        };

        // Mobile drawer toggle
        toggleMenuBtn.onclick = () => {
            sidebarEl.classList.remove("-translate-x-full");
            mobileOverlayEl.classList.remove("hidden");
        };
        mobileOverlayEl.onclick = () => {
            sidebarEl.classList.add("-translate-x-full");
            mobileOverlayEl.classList.add("hidden");
        };

        // Initial Execution
        renderLessonsList();
        renderCurrentLesson();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 English Curriculum App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .tab-btn { position: relative; transition: all 0.3s ease; }
        .tab-btn.active { color: #2563eb; font-weight: 700; background-color: #eff6ff; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background-color: #2563eb; border-radius: 3px 3px 0 0; }
        
        #content-area { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ---- Lesson content (theory/practice/listening) ---- */
        .lesson-content h3.step{font-size:1.05rem;font-weight:700;color:#1e40af;margin:1.5rem 0 .6rem;padding:.3rem 0 .3rem .7rem;border-left:4px solid #2563eb}
        .lesson-content .scroll{overflow-x:auto;margin:.6rem 0;-webkit-overflow-scrolling:touch}
        .lesson-content table{border-collapse:collapse;width:100%;min-width:380px;font-size:.9rem;background:#fff;border-radius:.75rem;overflow:hidden}
        .lesson-content th,.lesson-content td{border:1px solid #e5e7eb;padding:.6rem .75rem;text-align:left;vertical-align:top}
        .lesson-content th{background:#eff6ff;color:#1e40af;font-weight:700;font-size:.78rem}
        .lesson-content .note{color:#6b7280;font-size:.88rem;margin:.3rem 0 .8rem}
        .lesson-content .grid-letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:.5rem}
        .lesson-content .say{background:#fff;border:1.5px solid #e5e7eb;border-radius:.75rem;padding:.55rem .3rem;text-align:center;cursor:pointer;transition:.15s;font:inherit;color:#1f2937}
        .lesson-content .say:hover{border-color:#2563eb;background:#eff6ff;transform:translateY(-2px)}
        .lesson-content .say b{display:block;font-size:1.1rem}
        .lesson-content .say small{color:#9ca3af;font-size:.7rem}
        .lesson-content .ex{background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:1rem;padding:1rem 1.1rem;margin:.8rem 0}
        .lesson-content .q{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px dashed #e2e8f0}
        .lesson-content .q:last-of-type{border-bottom:0}
        .lesson-content .q .num{color:#94a3b8;font-size:.85rem;min-width:1.4rem}
        .lesson-content .q .txt{flex:1;min-width:180px;font-size:.92rem}
        .lesson-content input[type=text]{font:inherit;font-size:.9rem;padding:.4rem .6rem;border:1.5px solid #d1d5db;border-radius:.6rem;background:#fff;color:#1f2937;width:200px}
        .lesson-content input.ok{border-color:#10b981;background:#ecfdf5}
        .lesson-content input.bad{border-color:#ef4444;background:#fef2f2}
        .lesson-content .opts{display:flex;gap:.4rem;flex-wrap:wrap}
        .lesson-content .opt{font:inherit;font-size:.83rem;padding:.35rem .75rem;border-radius:999px;border:1.5px solid #d1d5db;background:#fff;color:#374151;cursor:pointer;transition:.15s}
        .lesson-content .opt:hover{border-color:#8b5cf6;transform:translateY(-1px)}
        .lesson-content .opt.ok{background:#ecfdf5;border-color:#10b981;color:#047857;font-weight:700}
        .lesson-content .opt.bad{background:#fef2f2;border-color:#ef4444;color:#dc2626}
        .lesson-content .fb{font-size:.88rem;margin-top:.5rem;font-weight:700}
        .lesson-content .fb.ok{color:#059669}
        .lesson-content .fb.bad{color:#dc2626}
        .lesson-content .row-actions{display:flex;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}
        .lesson-content .btn{font:inherit;font-size:.83rem;font-weight:700;padding:.45rem .9rem;border-radius:999px;border:1.5px solid #d1d5db;background:#fff;color:#374151;cursor:pointer}
        .lesson-content .btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}
        .lesson-content .dialog p{margin:.25rem 0;font-size:.92rem}
        .lesson-content .dialog b{color:#2563eb}
        .lesson-content .hw{background:#fffbeb;border-left:5px solid #f59e0b;border-radius:.9rem;padding:.9rem 1.1rem;margin-top:1.3rem;font-size:.9rem;font-weight:600;color:#92400e}
        .lesson-content .cellwrap{display:inline-flex;align-items:center;gap:.4rem}
        .lesson-content .cellwrap .opt{padding:.1rem .4rem;font-size:.78rem}
        .lesson-content .fillrow{margin:.5rem 0;font-size:.92rem;line-height:2.2}
        .lesson-content input.freeform{font:inherit;font-size:.88rem;padding:.3rem .55rem;border:1.5px solid #d1d5db;border-radius:.6rem;width:160px;margin:0 .2rem}
        .lesson-content .audio-slot{margin:.7rem 0 1.1rem;border:2px dashed #8b5cf6;border-radius:.9rem;padding:.8rem 1rem;background:#f5f3ff}
        .lesson-content .audio-slot-label{font-size:.8rem;font-weight:700;color:#7c3aed;margin-bottom:.3rem}
        .lesson-content .audio-slot-box{font-size:.8rem;color:#6b7280;font-family:monospace;word-break:break-word;min-height:1.4em;border-radius:.5rem}
        .lesson-content .audio-slot-box:focus{outline:2px solid #7c3aed;background:#fff}
        .lesson-content [data-placeholder]:empty:before{content:attr(data-placeholder);color:#9ca3af;font-style:italic}
        .lesson-content .ans-wrap{display:inline-flex;align-items:center;gap:.4rem;flex-wrap:wrap}
        .lesson-content .ans-reveal{display:inline-block;min-width:130px;padding:.15rem .5rem;border-radius:.5rem;background:#ecfdf5;color:#047857;font-weight:700}
        .lesson-content .ans-reveal.hidden{display:none}
        .lesson-content .ans-reveal:focus{outline:2px solid #10b981}

        /* ---- Edit / Admin mode ---- */
        body.admin-mode .admin-only{display:block !important}
        .admin-only{display:none}
        body.editing .editable,body.editing h3.step[data-eid]{outline:1.5px dashed transparent;border-radius:.3rem;cursor:text}
        body.editing .editable:hover,body.editing h3.step[data-eid]:hover{outline-color:#8b5cf6}
        [contenteditable="true"]:focus{outline:2px solid #8b5cf6;background:#f5f3ff}
        .admin-add-btn{font-size:.82rem;font-weight:700;padding:.5rem 1rem;border-radius:.7rem;border:1.5px dashed #8b5cf6;background:#f5f3ff;color:#7c3aed;cursor:pointer;margin-top:.8rem}
        .admin-add-btn:hover{background:#ede9fe}
        #adminBadge{display:none;font-size:.72rem;background:#ede9fe;color:#7c3aed;padding:.3rem .6rem;border-radius:999px;font-weight:800}
        body.admin-mode #adminBadge{display:inline-block}
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-slate-800">

    <header class="bg-white shadow-sm z-20 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
            <div class="py-3 flex items-center gap-3 w-full md:w-auto">
                <div class="bg-blue-600 text-white font-bold px-3 py-2 rounded-lg text-lg shadow-sm">A1</div>
                <div>
                    <h1 class="font-bold text-gray-900 leading-tight text-lg">ENGLISH COURSE</h1>
                    <p class="text-xs text-gray-500 font-medium">Interactive Online App</p>
                </div>
            </div>
            
            <!-- 3 Tabs Navigation -->
            <div class="flex flex-row w-full md:w-auto mt-2 md:mt-0 border-t md:border-t-0 border-gray-100 items-center">
                <button onclick="switchTab('theory')" id="tab-theory" class="tab-btn active flex-1 md:flex-none flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 px-4 py-3 md:py-4 text-xs md:text-sm font-medium text-gray-500 hover:text-blue-600 hover:bg-gray-50">
                    <i data-lucide="book-open" class="w-5 h-5 md:w-4 md:h-4"></i>
                    <span>LÝ THUYẾT</span>
                </button>
                <button onclick="switchTab('practice')" id="tab-practice" class="tab-btn flex-1 md:flex-none flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 px-4 py-3 md:py-4 text-xs md:text-sm font-medium text-gray-500 hover:text-blue-600 hover:bg-gray-50">
                    <i data-lucide="edit-3" class="w-5 h-5 md:w-4 md:h-4"></i>
                    <span>LUYỆN TẬP</span>
                </button>
                <button onclick="switchTab('listening')" id="tab-listening" class="tab-btn flex-1 md:flex-none flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 px-4 py-3 md:py-4 text-xs md:text-sm font-medium text-gray-500 hover:text-blue-600 hover:bg-gray-50">
                    <i data-lucide="headphones" class="w-5 h-5 md:w-4 md:h-4"></i>
                    <span>LISTENING</span>
                </button>
                <span id="adminBadge">🔓 Admin</span>
                <div id="adminTools" class="hidden md:flex items-center gap-1 ml-2">
                    <button onclick="toggleEditing()" id="editToggleBtn" class="text-xs font-bold px-3 py-2 rounded-lg border border-violet-300 text-violet-700 hover:bg-violet-50">✏️ Sửa nội dung</button>
                    <button onclick="exportEdits()" class="text-xs font-bold px-3 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50">⬇️ Xuất</button>
                    <label class="text-xs font-bold px-3 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 cursor-pointer">⬆️ Nhập<input type="file" id="importFile" accept="application/json" class="hidden"></label>
                </div>
                <button onclick="toggleAdmin()" id="adminBtn" class="ml-2 text-xs font-bold px-3 py-2 rounded-lg border border-gray-300 text-gray-500 hover:bg-gray-50">🔒 Admin</button>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar Navigation -->
        <aside class="w-20 md:w-72 bg-white border-r border-gray-200 flex flex-col flex-shrink-0 z-10 transition-all duration-300">
            <div class="p-3 bg-slate-50 border-b border-gray-200 text-xs font-bold text-slate-500 uppercase tracking-wider text-center md:text-left">
                <span class="hidden md:inline">Danh sách bài học</span>
                <span class="md:hidden">Menu</span>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1" id="lesson-list">
                <!-- Javascript sẽ tự động điền danh sách bài học vào đây -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 bg-slate-50/50">
            <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 min-h-[80vh] flex flex-col overflow-hidden">
                
                <!-- Lesson Header -->
                <div class="bg-gradient-to-r from-blue-50 to-white p-6 border-b border-gray-100">
                    <div class="flex items-center gap-2 mb-2">
                        <span id="lesson-tag" class="px-3 py-1 rounded-full text-xs font-bold tracking-wide"></span>
                        <span id="lesson-number" class="text-gray-500 text-sm font-medium"></span>
                    </div>
                    <h2 id="lesson-title" class="text-2xl md:text-3xl font-bold text-gray-800"></h2>
                </div>

                <!-- Dynamic Content Area -->
                <div id="content-area" class="p-6 md:p-8 flex-1">
                    <!-- Nội dung bài học (Lý thuyết / Luyện tập / Listening) sẽ được JS chèn vào đây -->
                </div>
                
            </div>
        </main>
    </div>

    <script>
        const driveLink = "https://drive.google.com/drive/folders/1JHm2gM9XAbyOVvHmkowBs-IX4DcEoJCl";

        const lessonsData = [
            {
                id: 1, type: "TOPIC", title: "The Alphabet & Numbers",

<p class="note">Tiếng Anh không đọc theo mặt chữ như tiếng Việt. Học đúng tên chữ cái và số đếm ngay từ bài đầu giúp bạn đánh vần tên riêng, đọc số điện thoại và giá tiền chính xác xuyên suốt khóa học.</p>

<h3 class="step">2. Bảng chữ cái — bấm để nghe 🔊</h3>

<tr><td>Nhờ đọc lại số</td><td>Could you repeat that, please?</td><td>Bạn đọc lại được không?</td><td><button class="opt spk" data-say="Could you repeat that, please?">🔊</button></td></tr>
<tr><td>Hỏi giá</td><td>How much is this?</td><td>Cái này giá bao nhiêu?</td><td><button class="opt spk" data-say="How much is this?">🔊</button></td></tr>
</table></div>

<h3 class="step">6. Đọc số điện thoại &amp; giá tiền</h3>
<div class="scroll"><table>

<tr><td>Giá tiền</td><td>Đọc như số bình thường</td><td>90$ → ninety dollars</td></tr>
<tr><td>Tuổi</td><td>Số + years old (có thể bỏ "years old")</td><td>25 → twenty-five (years old)</td></tr>
</table></div>
</div>`,
                practice: `<div class="space-y-6 lesson-content">
<h3 class="step">Luyện tập nói (với giáo viên)</h3>
<ol style="font-size:.93rem">
<li>Nghe giáo viên đọc và lặp lại từng chữ cái ở mục 2.</li>

                listening: `<div class="space-y-6 lesson-content"><div class="admin-only" data-admin-add-audio="1"></div><div data-audio-embed="1"></div>

<h3 class="step">1. Câu khẳng định</h3>

                practice: `<div class="space-y-6 lesson-content">

<p class="note">Ví dụ: <i>She is a doctor.</i> → <i>She isn't a doctor.</i></p>
<div class="ex" id="ex-neg">

                practice: `<div class="space-y-6 lesson-content"><h3 class="step" data-eid="e1036">4. Practice Activities</h3>
<p data-eid="e1037" class="editable">4.1 Lên kế hoạch cho cuối tuần cùng giáo viên: hỏi giáo viên có rảnh không, rủ đi đâu đó, thống nhất giờ gặp. <span class="ans-wrap"><button type="button" class="opt ans-toggle" data-target="e1038">👁️ Đáp án</button> <span class="ans-reveal hidden" id="e1038" contenteditable="true" data-placeholder="(bấm để nhập đáp án mẫu)"></span></span></p>
<p data-eid="e1039" class="editable">4.2 Bài ôn tập tổng hợp: viết một đoạn hội thoại ngắn (5-6 câu) kết hợp ít nhất 3 điểm ngữ pháp đã học trong khóa (to be, simple present, simple past, present continuous, can/should/have to). <span class="ans-wrap"><button type="button" class="opt ans-toggle" data-target="e1040">👁️ Đáp án</button> <span class="ans-reveal hidden" id="e1040" contenteditable="true" data-placeholder="(bấm để nhập đáp án mẫu)"></span></span></p>

                listening: `<div class="space-y-6 lesson-content"><div class="admin-only" data-admin-add-audio="24"></div><div data-audio-embed="24"></div><h3 class="step" data-eid="e1033">3. Listening Practice</h3>

</div>
<p data-eid="e1034" class="editable">Giáo viên nói về kế hoạch cuối tuần của mình, học viên nghe và trả lời câu hỏi. </p>
<p data-eid="e1035" class="editable">Câu hỏi: 1. What is the speaker doing on Saturday? 2. Who is the speaker meeting? 3. Is the speaker free on Sunday? </p>
<h3 class="step" data-eid="e1041">5. Speaking Practice — Sample Dialogue</h3>
<div class="scroll"><table><tr><th>Speaker</th><th>Line</th></tr><tr><td><span data-eid="e1042" class="editable">A:</span></td><td><span class="cellwrap">What are you doing this weekend? <button type="button" class="opt spk" data-say="What are you doing this weekend?">🔊</button></span></td></tr><tr><td><span data-eid="e1043" class="editable">B:</span></td><td><span class="cellwrap">I&#x27;m not sure yet. I have to finish some work on Saturday morning. Are you free? <button type="button" class="opt spk" data-say="I&#x27;m not sure yet. I have to finish some work on Saturday morning. Are you free?">🔊</button></span></td></tr><tr><td><span data-eid="e1044" class="editable">A:</span></td><td><span class="cellwrap">Yes, I&#x27;m free on Saturday afternoon. Would you like to meet up? <button type="button" class="opt spk" data-say="Yes, I&#x27;m free on Saturday afternoon. Would you like to meet up?">🔊</button></span></td></tr><tr><td><span data-eid="e1045" class="editable">B:</span></td><td><span class="cellwrap">Sounds good! Last weekend I was too tired to go out, but I should relax more this time. <button type="button" class="opt spk" data-say="Sounds good! Last weekend I was too tired to go out, but I should relax more this time.">🔊</button></span></td></tr><tr><td><span data-eid="e1046" class="editable">A:</span></td><td><span class="cellwrap">Great, let&#x27;s meet at the coffee shop at 3 PM. <button type="button" class="opt spk" data-say="Great, let&#x27;s meet at the coffee shop at 3 PM.">🔊</button></span></td></tr><tr><td><span data-eid="e1047" class="editable">B:</span></td><td><span class="cellwrap">Perfect. See you then! <button type="button" class="opt spk" data-say="Perfect. See you then!">🔊</button></span></td></tr></table></div>
<p data-eid="e1048" class="editable">Your Turn <button type="button" class="opt spk" data-say="Your Turn">🔊</button></p>
<p data-eid="e1049" class="editable">Rủ giáo viên đi đâu đó vào cuối tuần này, thống nhất thời gian và địa điểm. </p>
<p data-eid="e1050" class="editable">Kể lại cuối tuần trước (simple past) và so sánh với kế hoạch cuối tuần này. </p></div>`
            }
        ];

        let currentTab = 'theory'; // Mặc định mở tab Lý thuyết
        let currentLessonId = 1;   // Mặc định mở bài 1

        // 1. Render danh sách bài học bên Sidebar
        function renderSidebar() {
            const listEl = document.getElementById('lesson-list');
            listEl.innerHTML = '';
            
            lessonsData.forEach(lesson => {
                const isActive = lesson.id === currentLessonId;
                const btn = document.createElement('button');
                
                // Style cho nút sidebar
                btn.className = `w-full text-left p-3 mb-1 rounded-xl transition-all duration-200 flex items-center justify-between md:block group ${
                    isActive ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-gray-100 text-gray-600 bg-white border border-transparent hover:border-gray-200'
                }`;
                btn.onclick = () => selectLesson(lesson.id);
                
                // Phân loại màu tag
                const tagBg = isActive ? 'bg-blue-500/50 text-white' : (lesson.type === 'GRAMMAR' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700');
                const tagColor = isActive ? 'text-white' : 'text-gray-800 group-hover:text-blue-600';
                
                btn.innerHTML = `
                    <div class="hidden md:block">
                        <div class="text-[10px] font-bold ${tagBg} inline-block px-2 py-0.5 rounded uppercase tracking-wider mb-1.5 transition-colors">${lesson.type}</div>
                        <div class="text-sm font-semibold truncate transition-colors ${tagColor}">Lesson ${lesson.id}: ${lesson.title}</div>
                    </div>
                    <!-- Giao diện Mobile thu gọn -->
                    <div class="md:hidden font-bold text-center w-full text-sm">L${lesson.id}</div>
                `;
                listEl.appendChild(btn);
            });
        }

        // 2. Xử lý chuyển đổi Tab (Theory / Practice / Listening)
        function switchTab(tabName) {
            currentTab = tabName;
            
            // Cập nhật trạng thái active cho nút bấm
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            
            // Render lại nội dung ngay lập tức
            renderContent();
        }

        // 3. Xử lý khi chọn một bài học từ Sidebar
        function selectLesson(id) {
            currentLessonId = id;
            renderSidebar();
            renderContent();
            
            // Trên mobile, cuộn lên đầu nội dung sau khi chọn bài
            if(window.innerWidth < 768) {
                document.querySelector('main').scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        // 4. Render khu vực nội dung chính dựa trên Bài & Tab đang chọn
        function renderContent() {
            const lesson = lessonsData.find(l => l.id === currentLessonId);
            if(!lesson) return;

            // Cập nhật Header của bài học
            const tagEl = document.getElementById('lesson-tag');
            tagEl.className = `px-3 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase ${
                lesson.type === 'GRAMMAR' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'
            }`;
            tagEl.textContent = lesson.type;
            
            document.getElementById('lesson-number').textContent = `Lesson ${lesson.id} of 24`;
            document.getElementById('lesson-title').textContent = lesson.title;

            const contentArea = document.getElementById('content-area');
            
            // Hiệu ứng Reset Animation
            contentArea.style.animation = 'none';
            contentArea.offsetHeight; // trigger reflow
            contentArea.style.animation = null;

            // Chèn nội dung tương ứng với Tab
            if (currentTab === 'theory') {
                contentArea.innerHTML = lesson.theory;
            } else if (currentTab === 'practice') {
                contentArea.innerHTML = lesson.practice;
            } else if (currentTab === 'listening') {
                
                /* MỤC QUAN TRỌNG: Gắn link Google Drive cố định cho mọi bài Listening */
                const audioDriveButton = `
                    <div class="bg-gradient-to-r from-purple-600 to-indigo-600 rounded-2xl p-6 mb-8 flex flex-col md:flex-row items-center justify-between gap-6 shadow-lg shadow-purple-200">
                        <div class="flex items-center gap-4 text-white">
                            <div class="p-3 bg-white/20 rounded-full backdrop-blur-sm"><i data-lucide="folder-open" class="w-8 h-8"></i></div>
                            <div>
                                <h3 class="font-bold text-xl mb-1">Audio Files Folder</h3>
                                <p class="text-sm text-purple-100">Kho lưu trữ toàn bộ file nghe MP3 của khóa học.</p>
                            </div>
                        </div>
                        <a href="${driveLink}" target="_blank" class="w-full md:w-auto text-center px-8 py-3 bg-white text-purple-700 hover:bg-gray-50 font-bold rounded-xl transition-colors shadow-sm whitespace-nowrap flex items-center justify-center gap-2">
                            <i data-lucide="external-link" class="w-4 h-4"></i> Mở Google Drive
                        </a>
                    </div>
                `;
                
                contentArea.innerHTML = audioDriveButton + lesson.listening;
            }
            
            // Yêu cầu thư viện vẽ lại icons sau khi nhúng mã HTML mới
            lucide.createIcons();

            // Khởi tạo lại các thành phần tương tác sau khi nội dung mới được chèn
            afterRender();
        }

        /* =========================================================
           PHẦN MỞ RỘNG: Text-to-speech, chấm điểm, đáp án, admin mode
           ========================================================= */

        // ---- 1. Text-to-speech ----
        function say(text, rate){
            if(!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US'; u.rate = rate || 0.85;
            var vs = speechSynthesis.getVoices().filter(function(v){return v.lang.indexOf('en')===0;});
            if(vs.length) u.voice = vs[0];
            speechSynthesis.speak(u);
        }
        if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; }
        document.addEventListener('click', function(e){
            var b = e.target.closest('.spk');
            if(b && !document.body.classList.contains('editing')){ say(b.getAttribute('data-say'), b.getAttribute('data-rate')||0.85); }
        });

        // ---- 2. Chấm điểm / đáp án ----
        function norm(s){ return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.?!,]/g,'').replace(/\s+/g,' ').trim(); }
        function checkBox(root){
            var inputs = root.querySelectorAll('input[type=text]'); var ok=0, total=0;
            inputs.forEach(function(inp){
                if(!inp.hasAttribute('data-ans')) return;
                total++;
                var answers = inp.getAttribute('data-ans').split('|').map(norm);
                var v = norm(inp.value);
                if(v && answers.indexOf(v) > -1){ inp.classList.add('ok'); inp.classList.remove('bad'); ok++; }
                else { inp.classList.add('bad'); inp.classList.remove('ok'); }
            });
            var fb = root.querySelector('.fb'); if(!fb) return;
            fb.className = 'fb ' + (ok===total?'ok':'bad');
            fb.textContent = (ok===total?'🎉 Tuyệt vời! ':'') + 'Đúng ' + ok + '/' + total + ' câu.' + (ok<total?' Ô đỏ là câu cần sửa — thử lại nhé!':'');
        }
        document.addEventListener('click', function(e){
            var chk = e.target.closest('.check');
            if(chk){ checkBox(document.getElementById(chk.dataset.target)); return; }
            var rst = e.target.closest('.reset');
            if(rst){
                var r = document.getElementById(rst.dataset.target);
                r.querySelectorAll('input[type=text]').forEach(function(i){ i.value=''; i.className=''; });
                var fb = r.querySelector('.fb'); if(fb) fb.textContent='';
                return;
            }
            var shw = e.target.closest('.show');
            if(shw){
                var r2 = document.getElementById(shw.dataset.target);
                r2.querySelectorAll('input[data-ans]').forEach(function(i){ i.value=i.getAttribute('data-ans').split('|')[0]; i.className='ok'; });
                var fb2 = r2.querySelector('.fb'); if(fb2){ fb2.className='fb'; fb2.textContent='Đã hiện đáp án mẫu. Bấm "Làm lại" để tự luyện.'; }
                return;
            }
            var at = e.target.closest('.ans-toggle');
            if(at){ document.getElementById(at.dataset.target).classList.toggle('hidden'); return; }
        });
        function buildChoice(rootId, choices, fbId, labelMap){
            var root = document.getElementById(rootId); if(!root) return;
            root.querySelectorAll('.q').forEach(function(q){
                var holder = q.querySelector('.opts'); if(!holder || holder.dataset.built) return;
                holder.dataset.built = '1';
                choices.forEach(function(c){
                    var b = document.createElement('button');
                    b.type='button'; b.className='opt'; b.textContent = labelMap ? labelMap[c] : c;
                    b.addEventListener('click', function(){
                        if(q.dataset.done) return;
                        q.dataset.done='1';
                        var right = q.dataset.ans;
                        holder.querySelectorAll('.opt').forEach(function(o){ o.disabled = true; });
                        if(c===right){ b.classList.add('ok'); }
                        else {
                            b.classList.add('bad');
                            holder.querySelectorAll('.opt').forEach(function(o){
                                if(o.textContent === (labelMap?labelMap[right]:right)) o.classList.add('ok');
                            });
                        }
                        tally(rootId, fbId);
                    });
                    holder.appendChild(b);
                });
            });
        }
        function tally(rootId, fbId){
            var root = document.getElementById(rootId);
            var qs = root.querySelectorAll('.q'); var done=0, ok=0;
            qs.forEach(function(q){
                if(q.dataset.done){ done++; if(q.querySelector('.opt.ok') && !q.querySelector('.opt.bad')) ok++; }
            });
            var fb = document.getElementById(fbId); if(!fb) return;
            fb.className = 'fb ' + (done===qs.length && ok===qs.length ? 'ok' : '');
            fb.textContent = 'Đã làm ' + done + '/' + qs.length + ' — đúng ' + ok + ' câu.' + (done===qs.length && ok===qs.length ? ' 🎉 Hoàn hảo!' : '');
        }

        // ---- 3. Tiles cho Lesson 1 (alphabet / numbers) ----
        function tile(main, sub, speak, rate){
            var b = document.createElement('button');
            b.type='button'; b.className='say spk'; b.setAttribute('data-say', speak);
            if(rate) b.setAttribute('data-rate', rate);
            b.innerHTML = '<b>'+main+'</b><small>'+sub+'</small>';
            return b;
        }
        function buildLesson1Tiles(){
            var IPA = {A:'/eɪ/',B:'/biː/',C:'/siː/',D:'/diː/',E:'/iː/',F:'/ef/',G:'/dʒiː/',H:'/eɪtʃ/',I:'/aɪ/',J:'/dʒeɪ/',K:'/keɪ/',L:'/el/',M:'/em/',N:'/en/',O:'/oʊ/',P:'/piː/',Q:'/kjuː/',R:'/ɑːr/',S:'/es/',T:'/tiː/',U:'/juː/',V:'/viː/',W:'/ˈdʌbəljuː/',X:'/eks/',Y:'/waɪ/',Z:'/ziː/'};
            var alpha = document.getElementById('alphabet');
            if(alpha && !alpha.children.length) Object.keys(IPA).forEach(function(k){ alpha.appendChild(tile(k, IPA[k], k+'.', 0.7)); });
            var NUM = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
            var nums = document.getElementById('nums');
            if(nums && !nums.children.length) NUM.forEach(function(w,i){ nums.appendChild(tile(i, w, w, 0.8)); });
            var TENS = [[20,'twenty'],[30,'thirty'],[40,'forty'],[50,'fifty'],[60,'sixty'],[70,'seventy'],[80,'eighty'],[90,'ninety'],[100,'one hundred']];
            var tens = document.getElementById('tens');
            if(tens && !tens.children.length) TENS.forEach(function(p){ tens.appendChild(tile(p[0], p[1], p[1], 0.8)); });
            var PAIRS = [['thirteen','thirty'],['fourteen','forty'],['fifteen','fifty'],['sixteen','sixty'],['seventeen','seventy'],['eighteen','eighty'],['nineteen','ninety']];
            var pr = document.getElementById('pairs');
            if(pr && !pr.children.length) PAIRS.forEach(function(p){ pr.appendChild(tile(p[0]+' / '+p[1], 'nghe cặp', p[0]+'. '+p[1]+'.', 0.7)); });
        }
        function initMcqL2(){
            buildChoice('ex-mcq', ['am','is','are'], 'mcq-fb');
            buildChoice('ex-match', ['a','b','c'], 'match-fb', {a:"No, you aren't.", b:'Yes, she is.', c:"No, I'm not."});
        }

        // ---- 4. Admin mode: login, chỉnh sửa nội dung, thêm câu hỏi, gắn audio ----
        var ADMIN_PASSWORD = 'seta2026'; // đổi mật khẩu tại đây
        function isAdmin(){ try{ return sessionStorage.getItem('a1-admin')==='1'; }catch(e){ return false; } }
        function toggleAdmin(){
            if(isAdmin()){
                sessionStorage.removeItem('a1-admin');
                document.body.classList.remove('admin-mode');
                setEditing(false);
                document.getElementById('adminBtn').textContent = '🔒 Admin';
                afterRender();
                return;
            }
            var pw = prompt('Nhập mật khẩu Admin:');
            if(pw === ADMIN_PASSWORD){
                sessionStorage.setItem('a1-admin','1');
                document.body.classList.add('admin-mode');
                document.getElementById('adminBtn').textContent = '🔓 Thoát Admin';
                afterRender();
            } else if(pw !== null){
                alert('Sai mật khẩu.');
            }
        }
        function setEditing(on){
            document.body.classList.toggle('editing', on);
            var btn = document.getElementById('editToggleBtn');
            if(btn) btn.textContent = on ? '✅ Xong' : '✏️ Sửa nội dung';
            document.querySelectorAll('[data-eid]').forEach(function(el){
                if(el.classList.contains('editable') || el.tagName==='H3'){ el.setAttribute('contenteditable', on?'true':'false'); }
            });
        }
        function toggleEditing(){ setEditing(!document.body.classList.contains('editing')); }

        var EDIT_KEY = 'a1-edits';
        function loadEdits(){ try{ return JSON.parse(localStorage.getItem(EDIT_KEY)||'{}'); }catch(e){ return {}; } }
        function saveEditsObj(d){ try{ localStorage.setItem(EDIT_KEY, JSON.stringify(d)); }catch(e){} }
        function applyEdits(){
            var d = loadEdits();
            Object.keys(d).forEach(function(eid){
                var el = document.querySelector('[data-eid="'+eid+'"]');
                if(el) el.innerHTML = d[eid];
            });
        }
        var saveTimer = null;
        document.addEventListener('input', function(e){
            var el = e.target.closest('[data-eid]');
            if(!el) return;
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function(){
                var d = loadEdits();
                d[el.getAttribute('data-eid')] = el.innerHTML;
                saveEditsObj(d);
            }, 400);
        });
        function exportEdits(){
            var d = loadEdits();
            var extra = { customQuestions: loadCustomQ(), lessonAudio: loadAudio() };
            var blob = new Blob([JSON.stringify({edits:d, extra:extra}, null, 2)], {type:'application/json'});
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'a1-workbook-edits.json';
            a.click();
        }
        document.getElementById('importFile') && document.getElementById('importFile').addEventListener('change', function(e){
            var file = e.target.files[0]; if(!file) return;
            var reader = new FileReader();
            reader.onload = function(){
                try{
                    var incoming = JSON.parse(reader.result);
                    if(incoming.edits){
                        var cur = loadEdits(); Object.assign(cur, incoming.edits); saveEditsObj(cur);
                    }
                    if(incoming.extra){
                        if(incoming.extra.customQuestions) saveCustomQ(Object.assign(loadCustomQ(), incoming.extra.customQuestions));
                        if(incoming.extra.lessonAudio) saveAudio(Object.assign(loadAudio(), incoming.extra.lessonAudio));
                    }
                    applyEdits(); renderContent();
                    alert('Đã nhập chỉnh sửa thành công!');
                }catch(err){ alert('File không hợp lệ.'); }
            };
            reader.readAsText(file);
        });

        // ---- 4b. Thêm câu hỏi luyện tập (admin) ----
        var CQ_KEY = 'a1-customQuestions';
        function loadCustomQ(){ try{ return JSON.parse(localStorage.getItem(CQ_KEY)||'{}'); }catch(e){ return {}; } }
        function saveCustomQ(d){ try{ localStorage.setItem(CQ_KEY, JSON.stringify(d)); }catch(e){} }
        function addCustomQuestion(lessonId){
            var q = prompt('Nhập câu hỏi / đề bài:');
            if(!q) return;
            var a = prompt('Nhập đáp án (có thể để trống, học viên/giáo viên tự thêm sau):') || '';
            var d = loadCustomQ();
            if(!d[lessonId]) d[lessonId] = [];
            d[lessonId].push({q:q, a:a});
            saveCustomQ(d);
            renderContent();
        }
        function renderCustomQuestions(lessonId, container){
            var d = loadCustomQ();
            var list = d[lessonId] || [];
            if(!list.length) return;
            var html = '<div class="ex"><h3 class="step" style="margin-top:0">📝 Câu hỏi bổ sung (do Admin thêm)</h3>';
            list.forEach(function(item, idx){
                html += '<div class="q"><span class="num">'+(idx+1)+'</span><span class="txt">'+item.q.replace(/</g,'&lt;')+'</span>' +
                    '<span class="ans-wrap"><button type="button" class="opt ans-toggle" data-target="cq-'+lessonId+'-'+idx+'">👁️ Đáp án</button>' +
                    '<span class="ans-reveal hidden" id="cq-'+lessonId+'-'+idx+'" contenteditable="true">'+ (item.a? item.a.replace(/</g,'&lt;') : '') +'</span></span>' +
                    (isAdmin() ? ' <button type="button" class="opt" style="color:#dc2626;border-color:#fca5a5" onclick="removeCustomQuestion('+lessonId+','+idx+')">🗑️</button>' : '') +
                    '</div>';
            });
            html += '</div>';
            container.insertAdjacentHTML('beforeend', html);
        }
        function removeCustomQuestion(lessonId, idx){
            var d = loadCustomQ();
            if(d[lessonId]){ d[lessonId].splice(idx,1); saveCustomQ(d); renderContent(); }
        }

        // ---- 4c. Gắn audio Google Drive theo bài (admin) ----
        var AUD_KEY = 'a1-lessonAudio';
        function loadAudio(){ try{ return JSON.parse(localStorage.getItem(AUD_KEY)||'{}'); }catch(e){ return {}; } }
        function saveAudio(d){ try{ localStorage.setItem(AUD_KEY, JSON.stringify(d)); }catch(e){} }
        function toDrivePreview(link){
            var m = link.match(/\/file\/d\/([^\/]+)/) || link.match(/[?&]id=([^&]+)/);
            if(m) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
            return null;
        }
        function attachAudio(lessonId){
            var link = prompt('Dán link Google Drive của file audio bài '+lessonId+' (link chia sẻ dạng "Anyone with the link"):');
            if(!link) return;
            var preview = toDrivePreview(link);
            var d = loadAudio();
            d[lessonId] = { raw: link, preview: preview };
            saveAudio(d);
            renderContent();
        }
        function removeAudio(lessonId){
            var d = loadAudio();
            delete d[lessonId];
            saveAudio(d);
            renderContent();
        }
        function renderAudioEmbed(lessonId, container){
            var d = loadAudio();
            var info = d[lessonId];
            if(!info) return;
            var html = '<div class="ex" style="border-color:#a78bfa;background:#f5f3ff">';
            if(info.preview){
                html += '<iframe src="'+info.preview+'" width="100%" height="90" allow="autoplay" style="border-radius:.6rem;border:none"></iframe>';
            } else {
                html += '<a href="'+info.raw+'" target="_blank" class="btn primary">▶️ Mở file audio (Google Drive)</a>';
            }
            if(isAdmin()) html += '<div style="margin-top:.6rem"><button type="button" class="opt" style="color:#dc2626;border-color:#fca5a5" onclick="removeAudio('+lessonId+')">🗑️ Gỡ audio này</button></div>';
            html += '</div>';
            container.insertAdjacentHTML('beforeend', html);
        }

        // ---- 5. Hook: chạy sau mỗi lần render nội dung ----
        function afterRender(){
            applyEdits();
            document.querySelectorAll('[data-admin-add-q]').forEach(function(el){
                var lid = el.getAttribute('data-admin-add-q');
                renderCustomQuestions(lid, el.parentElement);
                if(isAdmin()){
                    el.innerHTML = '<button type="button" class="admin-add-btn" onclick="addCustomQuestion('+lid+')">➕ Thêm câu hỏi mới</button>';
                }
            });
            document.querySelectorAll('[data-admin-add-audio]').forEach(function(el){
                var lid = el.getAttribute('data-admin-add-audio');
                if(isAdmin()){
                    el.innerHTML = '<button type="button" class="admin-add-btn" onclick="attachAudio('+lid+')">🔗 Gắn link Google Drive cho bài này</button>';
                }
            });
            document.querySelectorAll('[data-audio-embed]').forEach(function(el){
                renderAudioEmbed(el.getAttribute('data-audio-embed'), el);
            });
            if(currentLessonId === 1 && (currentTab==='theory' || currentTab==='listening')) buildLesson1Tiles();
            if(currentLessonId === 2 && currentTab==='practice') initMcqL2();
            setEditing(document.body.classList.contains('editing'));
            if(isAdmin()) document.body.classList.add('admin-mode');
        }
        if(isAdmin()) document.body.classList.add('admin-mode');

        // Khởi động Ứng dụng khi trang web tải xong
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            if(isAdmin()){ document.body.classList.add('admin-mode'); document.getElementById('adminBtn').textContent='🔓 Thoát Admin'; }
            renderSidebar();
            renderContent();
        });
    </script>
</body>
</html>
